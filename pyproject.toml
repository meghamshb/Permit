[project]
name = "permit-assistant"
version = "0.1.0"
description = "Permit computer-access interfaces and routes"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
macos = ["pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'", "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'", "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'", "pyobjc-framework-ScreenCaptureKit>=11,<13; sys_platform == 'darwin'"]
windows = ["comtypes>=1.4,<2; sys_platform == 'win32'"]
browser = ["mcp>=1.20,<2"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["macos: requires a real macOS desktop", "windows: requires a real Windows desktop", "browser: requires local Playwright MCP and Chromium"]
