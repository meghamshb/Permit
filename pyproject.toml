[project]
name = "permit-assistant"
version = "0.1.0"
description = "Permit speech, computer access and controller integration"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "keyring==25.7.0"]

[project.optional-dependencies]
macos = [
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=11,<13; sys_platform == 'darwin'",
]
windows = ["comtypes>=1.4,<2; sys_platform == 'win32'"]
browser = ["mcp>=1.20,<2"]
hotkeys = ["pynput==1.8.1"]
speech = [
  "numpy==2.5.3",
  "sounddevice==0.5.6",
  "silero-vad==6.2.3",
  "winrt-Windows.Media.SpeechSynthesis==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
  "pyobjc-framework-AVFoundation==12.2.2; sys_platform == 'darwin'",
]
mac-asr = ["mlx-audio==0.5.7; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
permit-audio = "assistant.audio.cli:main"
permit = "assistant.controller.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "windows: requires a Windows machine and explicit live-test opt-in",
  "macos: requires a macOS machine and explicit live-test opt-in",
  "live_audio: opens audio devices or calls a real local provider",
  "browser: requires local Playwright MCP and Chromium",
]
